{% extends "base.html" %}
{% block title %}ログ{% endblock %}
{% block nav_logs %}font-semibold text-blue-600{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
  <div>
    <h1 class="text-xl font-bold text-gray-800">スタックちゃん ログ</h1>
    <p id="logMeta" class="text-xs text-gray-400 mt-0.5">読み込み中...</p>
  </div>
  <button onclick="load()" class="text-sm text-gray-400 hover:text-gray-600">↻ 更新</button>
</div>

<div class="flex gap-2 mb-4 text-xs flex-wrap">
  <button onclick="setFilter('ALL')"   id="f-ALL"   class="filter-btn px-3 py-1 rounded-full border">すべて</button>
  <button onclick="setFilter('ERROR')" id="f-ERROR" class="filter-btn px-3 py-1 rounded-full border">ERROR</button>
  <button onclick="setFilter('WARN')"  id="f-WARN"  class="filter-btn px-3 py-1 rounded-full border">WARN</button>
  <button onclick="setFilter('INFO')"  id="f-INFO"  class="filter-btn px-3 py-1 rounded-full border">INFO</button>
  <button onclick="setFilter('DEBUG')" id="f-DEBUG" class="filter-btn px-3 py-1 rounded-full border">DEBUG</button>
</div>

<div id="logList" class="font-mono text-xs space-y-0.5"></div>
<p id="empty" class="text-sm text-gray-400 hidden">ログがありません</p>
{% endblock %}

{% block scripts %}
<script>
  let _logs = [];
  let _filter = 'ALL';

  const LEVEL_COLOR = {
    ERROR: 'text-red-600 font-semibold',
    WARN:  'text-yellow-600 font-semibold',
    INFO:  'text-blue-600',
    DEBUG: 'text-gray-400',
  };

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setFilter(f) {
    _filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.className = 'filter-btn px-3 py-1 rounded-full border text-xs ' +
        (b.id === 'f-' + f
          ? 'bg-gray-800 text-white border-gray-800'
          : 'bg-white text-gray-500 hover:text-gray-800');
    });
    render();
  }

  function render() {
    const list  = document.getElementById('logList');
    const empty = document.getElementById('empty');
    const filtered = _filter === 'ALL' ? _logs : _logs.filter(l => l.level === _filter);
    if (!filtered.length) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    list.innerHTML = filtered.map(l => {
      const levelClass = LEVEL_COLOR[l.level] || 'text-gray-500';
      return `<div class="flex gap-2 py-0.5 border-b border-gray-100 hover:bg-gray-50 px-1">
        <span class="text-gray-400 shrink-0 w-36">${esc(l.ts_str)}</span>
        <span class="${levelClass} shrink-0 w-12">${esc(l.level)}</span>
        <span class="text-gray-700 break-all">${esc(l.msg)}</span>
      </div>`;
    }).join('');
  }

  async function load() {
    try {
      const d = await apiFetch('/api/device/log?limit=300');
      _logs = d.logs;
      document.getElementById('logMeta').textContent =
        `デバイス: ${d.device_id}　タイムゾーン: ${d.timezone}　${_logs.length}件`;
      render();
    } catch(e) {
      document.getElementById('logMeta').textContent = '❌ 読み込み失敗: ' + e.message;
    }
  }

  setFilter('ALL');
  load();
</script>
{% endblock %}
