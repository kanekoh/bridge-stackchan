<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}スタックちゃん管理{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-6 flex-wrap">
    <span class="font-bold text-gray-800">🤖 スタックちゃん</span>
    <a href="/ui/members" class="text-sm {% block nav_members %}text-gray-500 hover:text-gray-800{% endblock %}">家族メンバー</a>
    <a href="/ui/messages" class="text-sm {% block nav_messages %}text-gray-500 hover:text-gray-800{% endblock %}">伝言</a>
    <a href="/ui/test" class="text-sm {% block nav_test %}text-gray-500 hover:text-gray-800{% endblock %}">テスト</a>
    <a href="/ui/notifications" class="text-sm {% block nav_notifications %}text-gray-500 hover:text-gray-800{% endblock %}">通知</a>
    <a href="/ui/web-checks" class="text-sm {% block nav_web_checks %}text-gray-500 hover:text-gray-800{% endblock %}">受付確認</a>
    <a href="/ui/logs" class="text-sm {% block nav_logs %}text-gray-500 hover:text-gray-800{% endblock %}">ログ</a>
    {% if speaker_id_browser_url %}
    <span class="text-gray-200">|</span>
    <a href="{{ speaker_id_browser_url }}/" target="_blank" class="text-sm text-gray-500 hover:text-gray-800">話者登録 ↗</a>
    <a href="{{ speaker_id_browser_url }}/test.html" target="_blank" class="text-sm text-gray-500 hover:text-gray-800">話者テスト ↗</a>
    {% endif %}
    <a href="/ui/settings" class="text-sm ml-auto {% block nav_settings %}text-gray-400 hover:text-gray-700{% endblock %}">⚙ 設定</a>
  </nav>
  <main class="max-w-3xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <script>
    async function apiFetch(url, options = {}) {
      const res = await fetch(url, options);
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || res.statusText);
      }
      return res.status === 204 ? null : res.json();
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
